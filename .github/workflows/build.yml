name: CI

on:
  push:
    branches: [ pc_port ]
  # Any base branch, so pull requests stacked on other pull requests get checked too
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Install binutils
        run: |
          sudo apt update
          sudo apt install \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            g++-mingw-w64-i686 \
            g++-mingw-w64-x86-64 \
            libpng-dev \
            libsdl2-dev \
            gdb
        # build-essential and git are already installed
        # gcc-arm-none-eabi is only needed for the modern build
        # as an alternative to dkP

      - name: Install SDL2 MinGW libraries
        run: |
          # SDL's own site first, then the archive.org copy of the same file
          downloaded=false
          for url in https://www.libsdl.org/release/SDL2-devel-2.0.16-mingw.tar.gz \
                     https://archive.org/download/sdl-2-2.0.16/SDL2-devel-2.0.16-mingw.tar.gz; do
            if curl -fsSL --retry 3 --retry-all-errors -o SDL2-mingw.tar.gz "$url" &&
               echo "2bfe48628aa9635c12eac7d421907e291525de1d0b04b3bca4a5bd6e6c881a6f  SDL2-mingw.tar.gz" | sha256sum -c -; then
              downloaded=true
              break
            fi
          done
          $downloaded
          tar -xzf SDL2-mingw.tar.gz
          mv SDL2-2.0.16 SDL2

      - name: Modern
        env:
          MODERN: 1
          COMPARE: 0
        run: make -j${nproc} all

      - name: Windows (64-bit)
        env:
          IS64BIT: 1
        run: |
          make -j${nproc} winwsl WERROR=1
          cp SDL2/x86_64-w64-mingw32/bin/SDL2.dll .

      - name: Upload Windows (64-bit) build
        uses: actions/upload-artifact@v7
        with:
          name: windows64
          path: |
            pokeemerald64.exe
            SDL2.dll

      - name: Windows (32-bit)
        env:
          IS64BIT: 0
        run: make -j${nproc} winwsl WERROR=1

      # The backend without SDL, so that it keeps building
      - name: Windows (64-bit, Win32 backend)
        env:
          IS64BIT: 1
        run: make -j${nproc} winwsl WERROR=1 TARGET_PLATFORM=PLATFORM_WIN32

      - name: Linux (64-bit)
        env:
          IS64BIT: 1
        # Debug info (it doesn't change the code) is needed by the data audit below
        run: make -j${nproc} linux CFLAGS=-g WERROR=1

      - name: Headless tests (Linux 64-bit)
        run: python3 test/headless/smoke.py ./pokeemerald64 --audit --out build/headless

      - name: Upload headless test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: headless-linux64
          path: build/headless

      #- name: Linux (32-bit)
      #  env:
      #    IS64BIT: 0
      #  run: make -j${nproc} linux

  # The PC port is built from the same code as the GBA ROM, and changes for the port
  # shouldn't change the ROM, so pull requests compare it with the base branch's
  gba-rom:
    runs-on: ubuntu-latest
    env:
      COMPARE: 0
    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          fetch-depth: 0

      - name: Checkout agbcc
        uses: actions/checkout@master
        with:
          path: agbcc
          repository: pret/agbcc

      - name: Install binutils
        run: |
          sudo apt update
          sudo apt install binutils-arm-none-eabi libpng-dev

      - name: Install agbcc
        run: |
          ./build.sh
          ./install.sh ../
        working-directory: agbcc

      - name: agbcc
        run: |
          make -j$(nproc) all syms
          sha1sum pokeemerald.gba

      - name: Compare with the base branch
        if: github.event_name == 'pull_request'
        run: |
          git worktree add ../base ${{ github.event.pull_request.base.sha }}
          cp -r tools/agbcc ../base/tools/
          make -C ../base -j$(nproc) all
          sha1sum pokeemerald.gba ../base/pokeemerald.gba
          if ! cmp -s pokeemerald.gba ../base/pokeemerald.gba; then
            echo "::error::The GBA ROM differs from the one built from the base branch"
            exit 1
          fi

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Install libraries
        run: |
          sudo apt update
          sudo apt install libpng-dev libsdl2-dev

      # ASan can't map its shadow memory with the runner kernel's default ASLR entropy
      - name: Reduce ASLR entropy
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Linux (64-bit, ASan and UBSan)
        run: make -j$(nproc) linux CFLAGS=-g WERROR=1 SANITIZE=address,undefined

      - name: Headless tests
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python3 test/headless/smoke.py ./pokeemerald64 --out build/headless

      - name: Upload headless test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: headless-sanitizers
          path: build/headless

  windows-test:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Download Windows (64-bit) build
        uses: actions/download-artifact@v8
        with:
          name: windows64

      - name: Headless tests (Windows 64-bit)
        run: python test/headless/smoke.py pokeemerald64.exe --out build/headless

      - name: Download Linux test output
        if: always()
        uses: actions/download-artifact@v8
        with:
          name: headless-linux64
          path: build/headless-linux

      # Not required to pass: differences point at platform-dependent behavior worth a look
      - name: Compare frames with Linux
        if: always()
        continue-on-error: true
        shell: python
        run: |
          import os, sys
          different = 0
          for name in sorted(os.listdir("build/headless")):
              linux = os.path.join("build/headless-linux", name, "hashes.txt")
              windows = os.path.join("build/headless", name, "hashes.txt")
              if not (os.path.exists(linux) and os.path.exists(windows)):
                  continue
              a, b = open(linux).read().splitlines(), open(windows).read().splitlines()
              first = next((i for i, (x, y) in enumerate(zip(a, b)) if x != y), None)
              if first is None and len(a) == len(b):
                  print(f"{name}: identical to Linux ({len(a)} frames)")
              else:
                  different += 1
                  print(f"{name}: differs from Linux from frame {first if first is not None else min(len(a), len(b))}")
          sys.exit(1 if different else 0)

      - name: Upload headless test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: headless-windows64
          path: build/headless
